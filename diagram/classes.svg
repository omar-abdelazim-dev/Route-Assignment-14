<text x="822" y="466" font-size="15">manages</text>
<text x="900" y="1060" font-size="17">Visibility: + public    - private    # protected</text>
<text x="900" y="1094" font-size="16">Notes are created and removed inside their notebook.</text>
<text x="900" y="1124" font-size="16">Detaching a notebook from a user keeps it intact.</text>
<text x="900" y="1154" font-size="16">Each note references exactly one author.</text>
